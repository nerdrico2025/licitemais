name: Keepalive

on:
  schedule:
    # A cada 3 dias, às 06:00 UTC
    - cron: "0 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Edge Function
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          curl --fail --silent --show-error "$SUPABASE_URL/functions/v1/ping"
